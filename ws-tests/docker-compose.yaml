services:
  nginx:
    image: nginx:alpine
    depends_on:
      - front
      - account
      - transactor
      - collaborator
      - stats
      - rekoni
      - datalake
      - stream
      - fulltext
      - aiBot
    ports:
      - 8083:8083
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  stream:
    image: 'intabiafusion/stream:${DOCKER_TAG:-latest}'
    pull_policy: never
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4031
      - STREAM_BASE_URL=http://localhost:8083/_stream
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_REGION=
      - STREAM_QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped
  postgres:
    image: postgres:18.1
    command: ['postgres', '-p', '5433']
    # Both regions share this instance, each in its own database - see postgres-init/.
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    extra_hosts:
      - 'huly.local:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -p 5433']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5433:5433
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    restart: unless-stopped

  db-migrator:
    image: 'intabiafusion/db-migrator:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5433/postgres
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:19093
      - --advertise-kafka-addr
        internal://redpanda:9093,external://localhost:19093
      - --pandaproxy-addr internal://0.0.0.0:8084,external://0.0.0.0:18084
      - --advertise-pandaproxy-addr
        internal://redpanda:8084,external://localhost:18084
      - --schema-registry-addr internal://0.0.0.0:8083,external://0.0.0.0:18083
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 768M
    ports:
      - 19093:19093
    healthcheck:
      test:
        [
          'CMD',
          'rpk',
          'cluster',
          'info',
          '-X',
          'user=superuser',
          '-X',
          'pass=secretpassword',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9093"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8083"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    depends_on:
      - redpanda
  minio:
    image: 'minio/minio'
    command: server /data --address ":9000" --console-address ":9001"
    expose:
      - 9000
      - 9001
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
  datalake:
    image: 'intabiafusion/datalake:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
      stats:
        condition: service_started
      account:
        condition: service_started
    environment:
      - PORT=4031
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      - STREAM_URL=http://stream:1080/recording
      - DB_URL=${DB_PG_URL}
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped
  elastic-plugins:
    image: intabiafusion/elastic-plugins:8.19.1-slim
    command:
      - sh
      - -c
      - |
        cp -pr /usr/share/elasticsearch/plugins/* /mnt/plugins/
    volumes:
      - elastic-plugins:/mnt/plugins
  elastic:
    image: 'elasticsearch:8.19.1'
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q analysis-icu ||
      ./bin/elasticsearch-plugin install --batch analysis-icu; exec
      /usr/local/bin/docker-entrypoint.sh eswrapper -Ediscovery.type=single-node
      -Expack.security.enabled=false -Expack.security.http.ssl.enabled=false"
    ports:
      - 9201:9200
    volumes:
      - elastic-plugins:/usr/share/elasticsearch/plugins
    depends_on:
      elastic-plugins:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms450m -Xmx450m
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
  account:
    image: 'intabiafusion/account:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - minio
      - postgres
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
      - ./region-config.yaml:/var/cfg/region-config.yaml
    environment:
      - ACCOUNT_PORT=3003
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      # Read-only admin panel access: admin-gates tests assert reads pass and mutations are refused.
      - BILLING_EMAILS=billing
      - STATS_URL=http://stats:4901
      - WORKSPACE_LIMIT_PER_USER=100
      - DB_URL=${DB_PG_URL}
      - REGION_CONFIG=/var/cfg/region-config.yaml
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      # - LAST_NAME_FIRST=true
      # - WS_LIVENESS_DAYS=1
      - ACCOUNTS_URL=http://localhost:8083/_account
      - BRANDING_PATH=/var/cfg/branding.json
      # - DISABLE_SIGNUP=true
      # Dev/testing only: fixed admin-operation OTP code (email delivery is off in tests). NEVER set in prod.
      - ADMIN_OTP_DEV_CODE=000000
      # OTP codes are short-lived by design; tests need room between requesting and entering one.
      - OTP_TIME_TO_LIVE=600
      - OTP_RETRY_DELAY=1
    restart: unless-stopped
  stats:
    image: 'intabiafusion/stats:${DOCKER_TAG:-latest}'
    pull_policy: never
    environment:
      - PORT=4901
      - SERVER_SECRET=secret
    restart: unless-stopped
  billing:
    image: 'intabiafusion/billing:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      account:
        condition: service_started
      datalake:
        condition: service_started
    environment:
      - PORT=4041
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - USAGE_UPDATE_INTERVAL=600
      - ALLOW_TEST_ENDPOINTS=true
    restart: unless-stopped
  workspace:
    image: 'intabiafusion/workspace:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - minio
      - stats
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - WAIT_TIMEOUT=100
      - WS_OPERATION=all+backup
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL}
      - STATS_URL=http://stats:4901
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REGION=
      - ACCOUNTS_URL=http://account:3003
      - ACCOUNTS_DB_URL=${DB_URL}
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      # - INIT_WORKSPACE=huly
    restart: unless-stopped
  workspace_europe:
    image: 'intabiafusion/workspace:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
      - minio
      - stats
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - WS_OPERATION=all+backup
      - REGION=europe
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_EU_URL}
      - STATS_URL=http://stats:4901
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://account:3003
      - ACCOUNTS_DB_URL=${DB_URL}
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      # - INIT_WORKSPACE=huly
    restart: unless-stopped
  collaborator:
    image: 'intabiafusion/collaborator:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - minio
      - transactor
      - stats
    environment:
      - COLLABORATOR_PORT=3079
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4901
    restart: unless-stopped
  front:
    image: 'intabiafusion/front:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - account
      - minio
      - elastic
      - collaborator
      - stats
      - transactor
    volumes:
      - ./branding-test.json:/app/dist/branding-test.json
    environment:
      - SERVER_PORT=8083
      - SERVER_SECRET=secret
      - ACCOUNTS_URL_INTERNAL=http://account:3003
      - ACCOUNTS_URL=http://localhost:8083/_account
      - STATS_URL=http://stats:4901
      - UPLOAD_URL=/files
      - GMAIL_URL=http://localhost:8088
      - CALENDAR_URL=http://localhost:8095
      - TELEGRAM_URL=http://localhost:8086
      - REKONI_URL=http://localhost:8083/_rekoni
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - GITHUB_URL=http://localhost:3501
      - PRINT_URL=http://localhost:4006
      - SIGN_URL=http://localhost:4007
      - BRANDING_URL=http://localhost:8083/branding-test.json
      - STATS_API=http://localhost:8083/_stats
      - STREAM_URL=http://localhost:8083/_stream/recording
      # - DISABLE_SIGNUP=true
      # OTP is on here so tests drive the real sign in flow; they read the code from account_db.
    restart: unless-stopped
  transactor:
    image: 'intabiafusion/transactor:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - minio
      - account
      - stats
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - REGION=
      - SERVER_PORT=3334
      - SERVER_SECRET=secret
      - ENABLE_COMPRESSION=true
      - STATS_URL=http://stats:4901
      - FULLTEXT_URL=http://fulltext:4710
      - DB_URL=${DB_URL}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - ACCOUNTS_URL=http://account:3003
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://aiBot:4011
      - RATE_LIMIT_MAX=25000
      - RATE_LIMIT_WINDOW=1000
  transactor-europe:
    image: 'intabiafusion/transactor:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
      - minio
      - account
      - stats
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_PORT=3335
      - REGION=europe
      - SERVER_SECRET=secret
      - ENABLE_COMPRESSION=true
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - DB_URL=${DB_EU_URL}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - ACCOUNTS_URL=http://account:3003
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://aiBot:4011
      - RATE_LIMIT_MAX=25000
      - RATE_LIMIT_WINDOW=1000
    restart: unless-stopped
  rekoni:
    image: 'intabiafusion/rekoni-service:${DOCKER_TAG:-latest}'
    pull_policy: never
    restart: unless-stopped
    environment:
      - STATS_URL=http://stats:4901
  fulltext:
    image: 'intabiafusion/fulltext:${DOCKER_TAG:-latest}'
    pull_policy: never
    restart: unless-stopped
    links:
      - elastic
      - rekoni
    environment:
      - PORT=4710
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=local_storage_index
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4901
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3003
  fulltext-europe:
    image: 'intabiafusion/fulltext:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - elastic
      - postgres
      - rekoni
    environment:
      - PORT=4711
      - REGION=europe
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_EU_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=local_eu_storage_index # Use different one to be able to check migration is working
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4901
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3003
    restart: unless-stopped
  aiBot:
    image: 'intabiafusion/ai-bot:${DOCKER_TAG:-latest}'
    pull_policy: never
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    environment:
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - MODE=all
      - PORT=4011
      - FIRST_NAME=Jolie
      - LAST_NAME=AI
      - PASSWORD=password
      - AVATAR_PATH=./avatar.png
      - AVATAR_CONTENT_TYPE=.png
      - STATS_URL=http://stats:4901
      - OPENAI_API_KEY=token
      - OPENAI_SUMMARY_MODEL=openai/gpt-oss-20b
      - OPENAI_TRANSLATE_MODEL=openai/gpt-oss-20b
      - OPENAI_BASE_URL=http://host.docker.internal:1234/v1/
      - CHUNK_STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin&rootBucket=chunks
  activity:
    image: 'intabiafusion/activity:${DOCKER_TAG:-latest}'
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - DB_URL=${DB_PG_URL}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - SECRET=secret
      - BRANDING_PATH=/var/cfg/branding.json
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped

volumes:
  elastic-plugins:
