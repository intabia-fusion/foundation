        en: Video conferences with recording
      - ru: AI-транскрибация и протоколы
        en: AI transcription and protocols
      - ru: Синхронный перевод в реальном времени
        en: Real-time simultaneous translation
      - ru: Использование API платформы
        en: Using the platform API
    priceMonthlyText:
      ru: Бесплатно
      en: Free
