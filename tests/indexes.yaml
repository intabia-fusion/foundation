      definition: CREATE INDEX tx_ws_class_modifiedon_idx ON public.tx USING btree ("workspaceId", _class, (("modifiedOn")::numeric) DESC)
    - name: tx_ws_modon_idx
      definition: CREATE INDEX tx_ws_modon_idx ON public.tx USING btree ("workspaceId", (("modifiedOn")::numeric) DESC)
    - name: tx_ws_objectid_class_idx
      definition: CREATE INDEX tx_ws_objectid_class_idx ON public.tx USING btree ("workspaceId", "objectId", _class)
  user_mention:
    - name: user_mention_pkey
      definition: CREATE UNIQUE INDEX user_mention_pkey ON public.user_mention USING btree ("workspaceId", _id)
    - name: user_mention_ws_attachedto_class_idx
      definition: CREATE INDEX user_mention_ws_attachedto_class_idx ON public.user_mention USING btree ("workspaceId", "attachedTo", _class)
  view:
    - name: view_pkey
      definition: CREATE UNIQUE INDEX view_pkey ON public.view USING btree ("workspaceId", _id)
    - name: view_workspaceid_attachedto__class_storing_rec_idx
      definition: >-
        CREATE INDEX view_workspaceid_attachedto__class_storing_rec_idx ON public.view USING btree ("workspaceId", "attachedTo", _class) INCLUDE (space, "modifiedBy", "createdBy", "modifiedOn",
        "createdOn", "%hash%", data)
