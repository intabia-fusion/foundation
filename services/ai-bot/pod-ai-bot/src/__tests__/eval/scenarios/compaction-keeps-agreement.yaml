name: compaction-keeps-agreement
mode: thread
lang: ru
# Пороги занижены, чтобы компактизация случилась на коротком разговоре, а не на сотне реплик.
compaction:
  budgetTokens: 250
  reserveTokens: 50
  keepRecentTokens: 80
world:
  history:
    - role: user
      content: Договоримся сразу - отвечай мне ТОЛЬКО списком из коротких пунктов, без вступлений и без выводов в конце.
    - role: assistant
      content: Принято, отвечаю списком коротких пунктов.
    - role: user
      content: Расскажи про этапы релизного процесса.
    - role: assistant
      content: |
        - планирование объёма
        - заморозка ветки
        - регресс на стенде
        - выкат по частям
        - наблюдение за метриками
    - role: user
      content: А что делает релиз-менеджер на каждом этапе, подробно по каждому пункту?
    - role: assistant
      content: |
        - планирование - собирает объём и сроки, согласует риски с командами
        - заморозка - закрывает мерджи, следит за исключениями
        - регресс - принимает результаты прогонов, решает про блокеры
        - выкат - управляет очередью и темпом, держит связь с дежурным
        - наблюдение - смотрит метрики и алерты, принимает решение об откате
    - role: user
      content: Какие метрики смотреть после выката и почему именно они?
    - role: assistant
      content: |
        - доля ошибок - первый признак сломанного пути
        - задержка ответа - деградация видна раньше, чем ошибки
        - очередь задач - копится, если обработка встала
        - использование памяти - утечка проявляется через часы
requirements:
  - id: R1
    text: ответ дан списком коротких пунктов, как договаривались в начале
  - id: R2
    text: договорённость о формате не потеряна при сжатии разговора
turns:
  - ask: Что делать, если после выката выросла доля ошибок?
expect:
  compacted: true
  worldUnchanged: true
  maxRoundsTotal: 2
