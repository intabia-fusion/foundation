services:
  stream:
    image: 'intabiafusion/stream:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      datalake:
        condition: service_started
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4031
      - STREAM_BASE_URL=http://localhost:8083/_stream
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_REGION=
      - STREAM_QUEUE_CONFIG=${QUEUE_CONFIG}
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  time-machine:
    image: 'intabiafusion/worker:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=${DB_PG_URL}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  activity:
    image: 'intabiafusion/activity:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - DB_URL=${DB_PG_URL}
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - SECRET=secret
      - BRANDING_PATH=/var/cfg/branding.json
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  postgres:
    image: postgres:18.1
    command: ["postgres", "-p", "5433"]
    ports:
      - 5433:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    restart: unless-stopped

  db-migrator:
    image: 'intabiafusion/db-migrator:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=${DB_PG_URL}
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:19093
      - --advertise-kafka-addr internal://redpanda:9093,external://localhost:19093
      - --pandaproxy-addr internal://0.0.0.0:8084,external://0.0.0.0:18084
      - --advertise-pandaproxy-addr internal://redpanda:8084,external://localhost:18084
      - --schema-registry-addr internal://0.0.0.0:8083,external://0.0.0.0:18083
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      # Cap memory; Seastar otherwise reserves all host RAM → OOM 137.
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --default-log-level=info
    ports:
      - 19093:19093
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:v2.8.3
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9093"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8083"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    depends_on:
      - redpanda
  minio:
    image: "minio/minio"
    command: server /data --address ":9000" --console-address ":9001"
    expose:
      - 9000
      - 9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
  elastic-plugins:
    image: intabiafusion/elastic-plugins:8.19.1-slim
    command:
      - sh
      - -c
      - |
        cp -pr /usr/share/elasticsearch/plugins/* /mnt/plugins/
    volumes:
      - elastic-plugins:/mnt/plugins
  elastic:
    image: "elasticsearch:8.19.1"
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q analysis-icu || ./bin/elasticsearch-plugin install --batch analysis-icu; exec /usr/local/bin/docker-entrypoint.sh eswrapper -Ediscovery.type=single-node -Expack.security.enabled=false -Expack.security.http.ssl.enabled=false"
    expose:
      - 9200
    volumes:
      - elastic-plugins:/usr/share/elasticsearch/plugins
    depends_on:
      elastic-plugins:
        condition: service_completed_successfully
    ports:
      - 9201:9200
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    healthcheck:
      interval: 5s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
  account:
    image: 'intabiafusion/account:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - minio
      - postgres
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
      - ./region-config.yaml:/var/cfg/region-config.yaml
    environment:
      - ACCOUNT_PORT=3003
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      # Dev/testing only: fixed admin-operation OTP code (email delivery is off in tests). NEVER set in prod.
      - ADMIN_OTP_DEV_CODE=000000
      - WORKSPACE_LIMIT_PER_USER=10000
      # Free fallback limits (match the free:true plan in plan-config.yaml). storagePerUserGB scales disk.
      - FREE_PLAN_LIMITS={"usersLimit":5,"storagePerUserGB":2,"tokenLimit":100000,"trafficLimitGB":0,"meetingMinutesLimit":0}
      - DB_URL=${DB_PG_URL}
      - REGION_CONFIG=/var/cfg/region-config.yaml
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  workspace:
    image: 'intabiafusion/workspace:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - postgres
      - minio
      - redpanda
    depends_on:
      redpanda:
        condition: service_started
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
      - ./region-config.yaml:/var/cfg/region-config.yaml
    environment:
      - WAIT_TIMEOUT=100
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - REGION_CONFIG=/var/cfg/region-config.yaml
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REGION=
      - ACCOUNTS_URL=http://account:3003
      - ACCOUNTS_DB_URL=${DB_PG_URL}
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    depends_on:
      - front0
      - account
      - transactor0
      - collaborator0
      - stats
      - rekoni
      - datalake
      - stream
      - fulltext
      - billing
      - sign
      - payment
    ports:
      - 8083:8083
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  front0:
    image: 'intabiafusion/front:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - account
      - minio
      - elastic
      - collaborator0
      - stats
      - transactor0
    volumes:
      - ./branding-test.json:/app/dist/branding-test.json
    environment:
      - SERVER_PORT=8083
      - SERVER_SECRET=secret
      - ACCOUNTS_URL_INTERNAL=http://account:3003
      - ACCOUNTS_URL=http://localhost:8083/_account
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - GMAIL_URL=http://localhost:8088
      - CALENDAR_URL=http://localhost:8095
      - REKONI_URL=http://localhost:8083/_rekoni
      - TELEGRAM_URL=http://localhost:8086
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - BRANDING_URL=http://localhost:8083/branding-test.json
      - USE_BINARY_PROTOCOL=${USE_BINARY_PROTOCOL:-}
      - STATS_URL=http://stats:4901
      - STATS_API=http://localhost:8083/_stats
      - STREAM_URL=http://localhost:8083/_stream/recording
      - DATALAKE_URL=http://localhost:8083/_datalake
      - PRINT_URL=http://localhost:8083/_print
      - BILLING_URL=http://localhost:8083/_billing
      - PAYMENT_URL=http://localhost:8083/_payment
      - AI_URL=http://localhost:8083/_ai
      - USE_OTP=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - ANALYTICS_COLLECTOR_URL=http://localhost:4018
      - LOVE_ENDPOINT=http://localhost:8083/_love
      - LIVEKIT_WS=ws://localhost:7890
  transactor0:
    image: 'intabiafusion/transactor:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
    links:
      - elastic
      - minio
      - rekoni
      - postgres
      - account
      - stats
      - redpanda
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - REGION=
      - SERVER_PORT=3334
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - ACCOUNTS_URL=http://account:3003
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      - ENABLE_COMPRESSION=true
      - RATE_LIMIT_MAX=25000
      - RATE_LIMIT_WINDOW=1000
      - WS_SLOW_CLIENT_DROP=${WS_SLOW_CLIENT_DROP:-1}
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  collaborator0:
    image: 'intabiafusion/collaborator:${DOCKER_TAG:-latest}'
    pull_policy: never
    links:
      - minio
      - transactor0
    environment:
      - COLLABORATOR_PORT=3079
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FULLTEXT_URL=http://fulltext:4710
      - STATS_URL=http://stats:4901
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  rekoni:
    image: 'intabiafusion/rekoni-service:${DOCKER_TAG:-latest}'
    pull_policy: never
    restart: on-failure
    environment:
      - STATS_URL=http://stats:4901
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318

  fulltext:
    image: 'intabiafusion/fulltext:${DOCKER_TAG:-latest}'
    pull_policy: never
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_started
      postgres:
        condition: service_healthy
      elastic:
        condition: service_healthy
    links:
      - elastic
      - postgres
      - rekoni
      - redpanda
    environment:
      - PORT=4710
      - SERVER_SECRET=secret
      - DB_URL=${DB_PG_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - ELASTIC_INDEX_NAME=local_storage_index
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  stats:
    image: 'intabiafusion/stats:${DOCKER_TAG:-latest}'
    pull_policy: never
    environment:
      - PORT=4901
      - SERVER_SECRET=secret
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  analytics:
    image: 'intabiafusion/analytics-collector:${DOCKER_TAG:-latest}'
    pull_policy: never
    extra_hosts:
      - "localhost:host-gateway"
    links:
      - stats
      - account
    ports:
      - 4018:4018
    environment:
      - SECRET=secret
      - PORT=4018
      - SERVICE_ID=analytics-collector-service
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  notifications:
    image: 'intabiafusion/notifications:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_started
      transactor0:
        condition: service_started
    volumes:
      - ./branding-test.json:/var/cfg/branding.json
    environment:
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - DB_URL=${DB_PG_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8083
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - BRANDING_PATH=/var/cfg/branding.json
    restart: unless-stopped
  datalake:
    image: 'intabiafusion/datalake:${DOCKER_TAG:-latest}'
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      stats:
        condition: service_started
      account:
        condition: service_started
      redpanda:
        condition: service_started
    environment:
      - PORT=4031
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - STATS_URL=http://stats:4901
      - STREAM_URL=http://stream:1080/recording
      - DB_URL=${DB_PG_URL}
      - BUCKETS=blobs,eu|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  preview:
    image: 'intabiafusion/preview:${DOCKER_TAG:-latest}'
    depends_on:
      datalake:
        condition: service_started
    environment:
      - SECRET=secret
      # Preview reads blobs through datalake for on-the-fly image resizing (proxied via nginx /_preview).
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - CACHE_PATH=/data/cache
    restart: unless-stopped
  billing:
    image: 'intabiafusion/billing:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      account:
        condition: service_started
      datalake:
        condition: service_started
    environment:
      - PORT=4043
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - DB_URL=${DB_PG_URL}
      # Storage usage is read from datalake stats; billing needs a datalake-kind config,
      # not the global minio one (collectDatalakeStats filters by kind === 'datalake').
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - USAGE_UPDATE_INTERVAL=600
      # Sanity tests drive the workspace token window through reset / set-used.
      - ALLOW_TEST_ENDPOINTS=true
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped

  payment:
    image: 'intabiafusion/payment:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      - PORT=4044
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - FRONT_URL=http://localhost:8083
      # Route to tbank-subscriptions with in-process mock bank (provider-agnostic, closer to prod).
      - PROVIDER=tbank
      - TBANK_SUBSCRIPTIONS_URL=http://tbank-subscriptions:4042
      - ALLOW_MOCK_PROVIDER=false
      # Tests fire many subscription mutations in a row from one IP; lift the per-IP cap.
      - SUBSCRIPTION_RATE_LIMIT_MAX=100000
      # Same for plan-config: every billing page open reads it twice, the whole suite shares one IP.
      - PLAN_CONFIG_RATE_LIMIT_MAX=100000
      - PLAN_CONFIG=/var/cfg/plan-config.yaml
      - QUEUE_CONFIG=${QUEUE_CONFIG}
    volumes:
      - ./plan-config.yaml:/var/cfg/plan-config.yaml:ro
    restart: unless-stopped

  tbank-subscriptions:
    image: 'intabiafusion/tbank-subscriptions:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      account:
        condition: service_started
      payment:
        condition: service_started
    environment:
      - SECRET=secret
      - PORT=4042
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - ACCOUNTS_URL=http://account:3003
      - FRONT_URL=http://localhost:8083
      # In-process mock bank: self-fires CONFIRMED/REJECTED webhook, no external terminal.
      - TBANK_MOCK=true
      - TBANK_SKIP_WEBHOOK_VERIFICATION=true
      - PAYMENT_URL=http://payment:4044
    restart: unless-stopped

  redis-test:
    image: redis:8.0.2-alpine3.21
    ports:
      - 6390:6379
    restart: unless-stopped

  love:
    image: 'intabiafusion/love:${DOCKER_TAG:-latest}'
    pull_policy: never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      account:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      - PORT=8087
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3003
      - DB_URL=${DB_PG_URL}
      # Love expects storage kind to be 'datalake' (or 's3') so that
      # checkRecordAvailable returns true (see services/love/src/main.ts).
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - S3_STORAGE_CONFIG=s3|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin&rootBucket=love-recordings-test
      - LIVEKIT_HOST=ws://host.docker.internal:7890
      - LIVEKIT_API_KEY=testkey
      - LIVEKIT_API_SECRET=testsecret_for_sanity_tests_min32chars
      - LIVEKIT_WEBHOOK_API_KEY=whtestkey
      - LIVEKIT_WEBHOOK_API_SECRET=whtestsecret_for_sanity_tests_min32chars
      - LIVEKIT_PROJECT=test-project
      - BILLING_URL=http://billing:4043
      - BILLING_POLL_INTERVAL=15
      - AGENTS=transcribe-test
      # WEBHOOK_URL intentionally omitted — LiveKit (run on host) already has
      # a global webhook in livekit-test-config.yaml pointing back to love
      # via nginx, so per-egress webhook override is not needed.
      - POLLING_ENABLED=true
      # Test stand only: the peer of a leaving office owner sits in a dead meeting until the
      # grace expires, so 15s of default grace was 31s of the love suite. 8s still covers a
      # host refresh under load. The interval stays at the default: at 3s the poller evicted
      # live participants on a stale snapshot ("ParticipantInfo with stale sessionId"), and the
      # grace deadline is pulled forward by scheduleNext anyway.
      - POLLING_INTERVAL_MS=10000
      - OWNER_REJOIN_GRACE_SEC=8
      - PENDING_JOIN_TIMEOUT_MS=60000
      - STATS_URL=http://stats:4901
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
    restart: unless-stopped

  # clisr worker serving the `pro` level from a local model on the host. Starts always but
  # idles unless a model server is up; only the @llm suite (rushx run-uitests) uses it.
  aibot_client_llm:
    image: intabiafusion/ai-bot
    pull_policy: never
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      aibot:
        condition: service_started
    volumes:
      - ./config-aibot-client.yaml:/var/cfg/config.yaml
    environment:
      - API_TOKEN=api-secret
      - MODE=client
      - SERVER_URL=ws://aibot:4010
      - CONFIG_PATH=/var/cfg/config.yaml
      - MAX_CONTENT_TOKENS=12800
      - MAX_HISTORY_RECORDS=500
      - STATS_URL=http://stats:4901
      - STT_PROVIDER=
    restart: unless-stopped

  aibot:
    image: intabiafusion/ai-bot
    pull_policy: never
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      account:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      # Mock provider registry: deterministic replies, per-level billing multipliers.
      - ./config-aibot.yaml:/var/cfg/config.yaml
    environment:
      - ACCOUNTS_URL=http://account:3003
      - SERVER_SECRET=secret
      - SERVICE_ID=ai-bot-service
      - API_TOKEN=api-secret
      # All-in-one role for sanity (event-router + llm-router + stt-worker).
      - MODE=all
      - FIRST_NAME=Julia
      - LAST_NAME=AI
      - PASSWORD=password
      - AVATAR_PATH=./avatar.png
      - AVATAR_CONTENT_TYPE=.png
      - PORT=4010
      # Mock LLM provider (deterministic, offline) — registry from CONFIG_PATH.
      # Mock provider runs inline on the pod (no clisr worker).
      - CONFIG_PATH=/var/cfg/config.yaml
      # STT served in-process via clisr (no external STT needed for sanity).
      - STT_PROVIDER=server
      - VAD_RMS_THRESHOLD=0.02
      - VAD_SPEECH_RATIO_THRESHOLD=0.1
      - LOVE_ENDPOINT=http://love:8087
      - BILLING_URL=http://billing:4043
      # Test stand only: append in/out/reasoning tokens + tok/s to every reply.
      - LLM_SHOW_USAGE=true
      - MAX_CONTENT_TOKENS=12800
      - MAX_HISTORY_RECORDS=500
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - CHUNK_STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin&rootBucket=ai-bot-chunks-test
      - STATS_URL=http://stats:4901
    restart: unless-stopped

  sign:
    image: 'intabiafusion/sign:${DOCKER_TAG:-latest}'
    pull_policy: never
    depends_on:
      account:
        condition: service_started
    volumes:
      - ../services/sign/pod-sign/debug/certificate.p12:/var/cfg/certificate.p12
      - ../services/sign/pod-sign/debug/branding.json:/var/cfg/branding.json
    environment:
      - SECRET=secret
      - MINIO_ENDPOINT=minio
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://account:3003
      - CERTIFICATE_PATH=/var/cfg/certificate.p12
      - SERVICE_ID=sign-service
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4901
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped

  livekit-egress-test:
    image: livekit/egress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./livekit-egress-test-config.yaml:/out/config.yaml:ro"
    environment:
      - EGRESS_CONFIG_FILE=/out/config.yaml
    depends_on:
      - redis-test
      - minio
    restart: unless-stopped

  print:
    image: "intabiafusion/print:${DOCKER_TAG:-latest}"
    network_mode: "service:nginx"
    depends_on:
     nginx:
      condition: service_started
    restart: unless-stopped
    environment:
      - SECRET=secret
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${DATALAKE_STORAGE_CONFIG}
      - STATS_URL=http://stats:4901
      - ACCOUNTS_URL=http://account:3003

volumes:
  elastic-plugins:
