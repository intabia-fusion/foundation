allowBuilds:
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/darwin-x64': true
  '@ffmpeg-installer/linux-arm': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-ia32': true
  '@ffmpeg-installer/linux-x64': true
  '@ffmpeg-installer/win32-ia32': true
  '@ffmpeg-installer/win32-x64': true
  '@livekit/local-inference': true
  '@parcel/watcher': true
  bufferutil: true
  core-js: true
  electron: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  pnpm: true
  protobufjs: true
  puppeteer: true
  sharp: true
  svelte-preprocess: true
  utf-8-validate: true

autoInstallPeers: false

excludeLinksFromLockfile: false

linkWorkspacePackages: true

patchedDependencies:
  kafkajs@2.2.4: common/pnpm-patches/kafkajs@2.2.4.patch

peerDependencyRules:
  ignoreMissing:
    - '@emnapi/core'
    - '@rspack/core'
    - '@types/dom-mediacapture-record'
    - '@types/dom-mediacapture-transform'
    - electron-builder-squirrel-windows

strictPeerDependencies: true
