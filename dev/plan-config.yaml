      en: Start
    description:
      ru: Соло-предприниматели и команды до 5 человек
      en: Solo entrepreneurs and teams of up to 5 people
    limits:
      - ru: до 5 пользователей
        en: up to 5 users
      - ru: до 50 гостей (внешних пользователей)
        en: up to 50 guests (external users)
      - ru: 2 ГБ хранилище / на пользователя
        en: 2 GB storage / per user
      - ru: 100 000 токенов AI-ассистента
        en: 100,000 AI assistant tokens
      - ru: Без ограничений проекты в трекере
        en: Unlimited projects in the tracker
      - ru: Общая горячая линия
        en: General hotline
    features:
