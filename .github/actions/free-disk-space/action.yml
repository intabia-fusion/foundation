name: 'Free Space'
description: 'Free up disk space by removing files and directories that are not needed for tests.'
runs:
  using: 'composite'
  steps:
    - name: Free space
      shell: bash
      run: |
        echo "Disk space before cleanup:"
        df -h
        # Deleting these trees serially costs minutes, they are hundreds of thousands of small files.
        sudo rm -rf /usr/share/dotnet &
        sudo rm -rf /usr/local/lib/android &
        sudo rm -rf /usr/share/az_* &
        sudo rm -rf /opt/az &
        sudo rm -rf /usr/lib/google-cloud-sdk &
        sudo rm -rf /opt/ghc &
        sudo rm -rf "/usr/local/share/boost" &
        # Keep the toolcache node: setup-node installs there, and jobs call free-disk-space
        # again after it, so wiping the whole tree drops them back to the image's Node 22.
        if [ -n "$AGENT_TOOLSDIRECTORY" ] && [ -d "$AGENT_TOOLSDIRECTORY" ]; then
          sudo find "$AGENT_TOOLSDIRECTORY" -mindepth 1 -maxdepth 1 ! -name node -exec rm -rf {} + &
        fi
        wait
        echo "Disk space after cleanup:"
        df -h
