# Keepalive pool to every backend. Without `keepalive` here nginx opens a new TCP
# connection per request - measured at ~6x fewer requests per CPU second.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

upstream account_up { server account:3003; keepalive 32; }
upstream aibot_up { server aiBot:4011; keepalive 32; }
upstream collaborator_up { server collaborator:3079; keepalive 32; }
upstream datalake_up { server datalake:4031; keepalive 32; }
upstream front_up { server front:8083; keepalive 32; }
upstream fulltext_up { server fulltext:4710; keepalive 32; }
upstream rekoni_up { server rekoni:4004; keepalive 32; }
upstream stats_up { server stats:4901; keepalive 32; }
upstream stream_up { server stream:1080; keepalive 32; }
upstream transactor_europe_up { server transactor-europe:3335; keepalive 32; }
upstream transactor_up { server transactor:3334; keepalive 32; }
upstream webhook_up { server webhook:4043; keepalive 32; }

server {
    listen 8083;
    server_name _;
    client_max_body_size 0;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://front_up;
    }

    location /_account {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/_account(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://account_up/;
    }

    location /_tr {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/_tr(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://transactor_up/;
    }

    location /_tr_europe {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/_tr_europe(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
