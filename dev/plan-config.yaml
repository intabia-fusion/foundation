      - ru: Общая горячая линия
        en: General hotline
    features:
      - ru: Доски и Kanban
        en: Boards and Kanban
      - ru: Документы и базы знаний
        en: Documents and knowledge bases
      - ru: Чат, треды и сквозные уведомления
        en: Chat, threads, and push notifications
      - ru: Календарь и планировщик созвонов
        en: Call calendar and scheduler
      - ru: Видеоконференции с записью
        en: Video conferences with recording
      - ru: AI-транскрибация и протоколы
        en: AI transcription and protocols
      - ru: Синхронный перевод в реальном времени
