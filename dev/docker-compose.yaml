  tbank-subscriptions:
    image: "intabiafusion/tbank-subscriptions:${DOCKER_TAG:-latest}"
    depends_on:
      account:
        condition: service_started
      payment:
        condition: service_started
    pull_policy: never
    environment:
      - SECRET=secret
      - PORT=4042
      # Required: tbank-subscriptions publishes subscription events to the Subscription queue
      # (pod-payment is the single consumer that bakes limits and writes to account).
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      - ACCOUNTS_URL=http://account:3000
      - FRONT_URL=http://localhost:8087
      # TBANK_MOCK is set by the docker:up:tbank overlay (docker-compose.tbank-mock.yaml).
      # Sandbox terminal credentials — set in your shell or a local (untracked) env file
      - TBANK_TERMINAL_KEY=${TBANK_TERMINAL_KEY:-test}
      - TBANK_PASSWORD=${TBANK_PASSWORD:-test}
      - TBANK_URL=https://securepay.tinkoff.ru
      # Fiscal receipt (54-ФЗ) tax params — match the terminal's cash desk settings
      - TBANK_TAXATION=${TBANK_TAXATION:-usn_income}
      - TBANK_VAT_TAX=${TBANK_VAT_TAX:-none}
      - SCHEDULER_INTERVAL_MINUTES=${TBANK_SCHEDULER_INTERVAL_MINUTES:-60}
      # Set to true to skip webhook token verification (for local dev with curl)
      - TBANK_SKIP_WEBHOOK_VERIFICATION=true
      # Email notifications: published to the platform notification queue, consumed by pod-mail
      # (-> mailpit on local). MAIL_FROM is optional; pod-mail falls back to its own SOURCE.
      - MAIL_FROM=platform@intabia.ru
      - BILLING_EMAILS=${BILLING_EMAILS:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-platform@intabia.ru}
      - SUPPORT_URL=${SUPPORT_URL:-https://t.me/intabia}
      # pod-payment URL — source of the shared plan-config (charge amounts) and localized plan labels for emails
      - PAYMENT_URL=http://payment:4040
      - GRACE_PERIOD_DAYS=${TBANK_GRACE_PERIOD_DAYS:-7}
      # Days before a charge / expiry date the reminder email is sent
      - UPCOMING_NOTICE_DAYS=${TBANK_UPCOMING_NOTICE_DAYS:-5}
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped
  notifications:
    image: "intabiafusion/notifications:${DOCKER_TAG:-latest}"
    depends_on:
