# LiveKit running in docker with host network for CI (Linux only).
# Mac/Windows do not support network_mode: host - use prepare-pg.sh local livekit-server instead.
services:
  livekit-test:
    # Pinned: a floating tag silently changes the server under the suite between
    # runs. Bump together with the local brew install (see docs/love.md).
    image: livekit/livekit-server:v1.13.5
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit-test-config.ci.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
