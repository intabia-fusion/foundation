    free: true
    storagePerUserGB: 2
    trafficLimitGB: 0
    meetingMinutesLimit: 0
    tokenLimit: 100000
    usersLimit: 5
    guestsLimit: 50
    windowMonthLimit: 100000
    index: 0
    color: Sky
