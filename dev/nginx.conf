client_max_body_size 0;

# Keepalive pool to every backend. Without `keepalive` here nginx opens a new TCP
# connection per request - measured at ~6x fewer requests per CPU second.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

upstream account_up { server account:3000; keepalive 32; }
upstream aibot_up { server aibot:4010; keepalive 32; }
upstream billing_up { server billing:4041; keepalive 32; }
upstream collaborator0_up { server collaborator0:3078; keepalive 32; }
upstream datalake_up { server datalake:4030; keepalive 32; }
upstream export_up { server export:4009; keepalive 32; }
upstream front_up { server front:8080; keepalive 32; }
upstream fulltext_up { server fulltext:4702; keepalive 32; }
upstream link_preview_up { server link-preview:4042; keepalive 32; }
upstream love_up { server love:8096; keepalive 32; }
upstream mail_server_up { server mail_server:8097; keepalive 32; }
upstream payment_up { server payment:4040; keepalive 32; }
upstream preview_up { server preview:4040; keepalive 32; }
upstream print_up { server print:4005; keepalive 32; }
upstream rekoni_up { server rekoni:4004; keepalive 32; }
upstream sign_up { server sign:4006; keepalive 32; }
upstream stats_up { server stats:4900; keepalive 32; }
upstream stream_up { server stream:1080; keepalive 32; }
upstream tbank_subscriptions_up { server tbank-subscriptions:4042; keepalive 32; }
upstream transactor_up { server transactor:3332; keepalive 32; }
upstream webhook_up { server webhook:4043; keepalive 32; }
upstream webhook_mock_up { server webhook-mock:4044; keepalive 32; }

server {
    listen 8087;

    # Health check
    location /health {
        return 200;
    }

    # Transactor - base64-encoded tokens (WebSocket)
    location ~ ^/eyJ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://transactor_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account service
    location /_account {
        rewrite ^/_account(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://account_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Transactor (WebSocket)
    location /_tr {
        rewrite ^/_tr(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://transactor_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collaborator (WebSocket)
    location /_cl {
