services:
  stream:
    image: "intabiafusion/stream:${DOCKER_TAG:-latest}"
    pull_policy: never
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4030
      - STREAM_BASE_URL=http://localhost:8087/_stream
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=secret
      - STREAM_MAX_PARALLEL_SCALING_COUNT=6
      - STREAM_LOG_LEVEL=debug
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - STREAM_REGION=
      - STREAM_QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - front
    ports:
      - 8087:8087
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  media:
    image: "intabiafusion/media:${DOCKER_TAG:-latest}"
    environment:
      - ACCOUNTS_URL=http://account:3000
      - SECRET=secret
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
    restart: unless-stopped
  preview:
    image: "intabiafusion/preview:${DOCKER_TAG:-latest}"
    environment:
      - SECRET=secret
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - CACHE_PATH=/data/cache
    restart: unless-stopped
  postgres:
    image: postgres:18.1
    command: ["postgres", "-p", "5432"]
    shm_size: 128mb
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - dbpg:/var/lib/postgresql
    restart: unless-stopped
  redpanda:
    image: redpandadata/redpanda:v25.2.11
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
        internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
        internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --memory 256M
    ports:
      - 19092:19092
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redpanda_console:
    container_name: redpanda-console
    image: redpandadata/console:v3.2.2
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    volumes:
      - ./config:/tmp/config/
    environment:
      CONFIG_FILEPATH: ${CONFIG_FILEPATH:-/tmp/config.yml}
      CONSOLE_CONFIG_FILE: |
        # Configure a connection to the Redpanda cluster
        # See https://docs.redpanda.com/current/console/config/connect-to-redpanda/
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
    depends_on:
      redpanda:
        condition: service_healthy
  minio:
    image: "minio/minio"
    command: server /data --address ":9000" --console-address ":9001"
    expose:
      - 9000
      - 9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  elastic-plugins:
    image: intabiafusion/elastic-plugins:8.19.1-slim
    command:
      - sh
      - -c
      - |
        cp -pr /usr/share/elasticsearch/plugins/* /mnt/plugins/
    volumes:
      - elastic-plugins:/mnt/plugins
  elastic:
    image: "elasticsearch:8.19.1"
    command: >
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q analysis-icu ||
      ./bin/elasticsearch-plugin install --batch analysis-icu; exec
      /usr/local/bin/docker-entrypoint.sh eswrapper -Ediscovery.type=single-node
      -Expack.security.enabled=false -Expack.security.http.ssl.enabled=false"
    expose:
      - 9200
    volumes:
      - elastic:/usr/share/elasticsearch/data
      - elastic-plugins:/usr/share/elasticsearch/plugins
    depends_on:
      elastic-plugins:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms450m -Xmx450m
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
  redis:
    image: redis:8.0.2-alpine3.21
    ports:
      - 6379:6379
    restart: unless-stopped

  account:
    image: "intabiafusion/account:${DOCKER_TAG:-latest}"
    links:
      - stats
    volumes:
      - ./branding.json:/var/cfg/branding.json
      - ./region-config.yaml:/var/cfg/region-config.yaml
    environment:
      - ACCOUNT_PORT=3000
      - IGNORE_EMAIL_SIGNUP=false # Set to true if you want to disable email/otp confirmations
      # Dev/testing only: fixed admin-operation OTP code (email delivery is off in dev). NEVER set in prod.
      - ADMIN_OTP_DEV_CODE=000000
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_SECRET=secret
      - ADMIN_EMAILS=admin,${PLATFORM_ADMIN_EMAILS}
      - BILLING_EMAILS=billing
      - STATS_URL=http://stats:4900
      - WORKSPACE_LIMIT_PER_USER=10000
      # Free fallback limits (must match the free:true plan in plan-config.yaml). Applied to every
      # tier subscription on read and decides free-vs-readonly on unpaid status. storagePerUserGB scales disk.
      - FREE_PLAN_LIMITS={"usersLimit":5,"storagePerUserGB":2,"tokenLimit":100000,"trafficLimitGB":0,"meetingMinutesLimit":0}
      - DB_URL=${DB_URL_PG}
      - REGION_CONFIG=/var/cfg/region-config.yaml
      - MAIL_URL=
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8087
      - LAST_NAME_FIRST=true
      # - WS_LIVENESS_DAYS=1
      - ACCOUNTS_URL=http://localhost:8087/_account
      - BRANDING_PATH=/var/cfg/branding.json
      # - DISABLE_SIGNUP=true
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - MAILBOX_DOMAINS=huly.dev.local
      - MAILBOX_MAX_COUNT_PER_ACCOUNT=2
    # Debug: uncomment to enable remote debugging
    # ports:
    #   - 9230:9230
    # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9230
    restart: unless-stopped
  stats:
    image: "intabiafusion/stats:${DOCKER_TAG:-latest}"
    environment:
      - PORT=4900
      - SERVER_SECRET=secret
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      # Debug: uncomment to enable remote debugging
      # ports:
      #   - 9235:9235
      # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9235
    restart: unless-stopped
  payment:
    image: "intabiafusion/payment:${DOCKER_TAG:-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      account:
        condition: service_started
    volumes:
      - ./plan-config.yaml:/var/cfg/plan-config.yaml
    environment:
      - SECRET=secret
      - PORT=4040
      - ACCOUNTS_URL=http://account:3000
      - FRONT_URL=http://localhost:8087
      - USE_SANDBOX=true
      - PLAN_CONFIG=/var/cfg/plan-config.yaml
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
      # TBank provider (needs real terminal credentials; use mock below for local dev)
      # - PROVIDER=tbank
      # - TBANK_SUBSCRIPTIONS_URL=http://tbank-subscriptions:4042
      # Mock provider: activates plans instantly without a real payment gateway.
      - PROVIDER=mock
      - ALLOW_MOCK_PROVIDER=true
      # Polar configuration (uncomment if using Polar)
      # - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      # - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
      # - POLAR_SUBSCRIPTION_PLANS=${POLAR_SUBSCRIPTION_PLANS}
      # Stripe configuration (uncomment if using Stripe)
      # - STRIPE_API_KEY=${STRIPE_API_KEY}
      # - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # - STRIPE_SUBSCRIPTION_PLANS=${STRIPE_SUBSCRIPTION_PLANS}
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      # Nightly trial-expiry sweep. Leave TRIAL_EXPIRY_INTERVAL_MINUTES unset to use the schedule;
      # set it in .env to sweep every N minutes instead (testing only).
      - TRIAL_EXPIRY_HOUR_UTC=${TRIAL_EXPIRY_HOUR_UTC:-21}
      - TRIAL_EXPIRY_INTERVAL_MINUTES=${TRIAL_EXPIRY_INTERVAL_MINUTES:-}
      - MAIL_FROM=platform@intabia.ru
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-platform@intabia.ru}
      - SUPPORT_URL=${SUPPORT_URL:-https://t.me/intabia}
    restart: unless-stopped
  workspace:
    image: "intabiafusion/workspace:${DOCKER_TAG:-latest}"
    links:
      - postgres
      - minio
      - stats
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - WS_OPERATION=all+backup
      - REGION=
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL_PG}
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=${DB_URL_PG}
      - BRANDING_PATH=/var/cfg/branding.json
      - BACKUP_STORAGE=${BACKUP_STORAGE_CONFIG}
      - BACKUP_BUCKET=${BACKUP_BUCKET_NAME}
      - MAIL_URL=
      # - INIT_WORKSPACE=staging-dev
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      # Debug: uncomment to enable remote debugging
      # ports:
      #   - 9231:9231
      # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9231
    restart: unless-stopped
  collaborator0:
    image: "intabiafusion/collaborator:${DOCKER_TAG:-latest}"
    links:
      - minio
      - transactor
      - stats
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4900
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      # Debug: uncomment to enable remote debugging
      # ports:
      #   - 9233:9233
      # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9233
    restart: unless-stopped
  front:
    image: "intabiafusion/front:${DOCKER_TAG:-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    links:
      - stats
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=secret
      - ACCOUNTS_URL=http://localhost:8087/_account
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - STATS_URL=http://stats:4900
      - STATS_API=http://localhost:8087/_stats
      - FILES_URL=http://localhost:8087/_datalake/blob/:workspace/:blobId/:filename
      - UPLOAD_URL=/files
      - PREVIEW_URL=http://localhost:8087/_preview
      - GMAIL_URL=http://host.docker.internal:8093
      - CALENDAR_URL=http://host.docker.internal:8095
      - TELEGRAM_URL=http://host.docker.internal:8086
      - REKONI_URL=http://localhost:8087/_rekoni
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - GITHUB_URL=http://host.docker.internal:3500
      - PRINT_URL=http://localhost:8087/_print
      - SIGN_URL=http://localhost:8087/_sign
      #      - ANALYTICS_COLLECTOR_URL=http://localhost:4017
      - DESKTOP_UPDATES_URL=http://localhost
      - DESKTOP_UPDATES_CHANNEL=dev
      - DESKTOP_UPDATES_CHANNELS=dev;tracex:dev-tracex
      - BRANDING_URL=http://localhost:8087/branding.json
      - STREAM_URL=http://localhost:8087/_stream/recording
      - PAYMENT_URL=http://localhost:8087/_payment
      - BILLING_URL=http://localhost:8087/_billing
      # - BACKUP_URL=http://localhost:8087/_backup/api/backup
      - EXCLUDED_APPLICATIONS_FOR_ANONYMOUS=["chunter", "notification"]
      # - DISABLE_SIGNUP=true
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - DATALAKE_URL=http://localhost:8087/_datalake
      # - HULYLAKE_URL=http://love:8096
      - AI_URL=http://localhost:8087/_ai
      # - LANDING_URL=http://localhost:9078/landing/
      - LOVE_ENDPOINT=http://localhost:8087/_love
      - LIVEKIT_WS=ws://host.docker.internal:7880
      - EXPORT_URL=http://localhost:8087/_export
      - LINK_PREVIEW_URL=http://localhost:8087/_link-preview
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      - USAGE_URL=http://localhost:8080/terms
      - COPYRIGHT=
      - SUPPORT_URL=https://t.me/intabia
      - LICENSE_URL=https://localhost:8080/legal/license
      - USERAGREEMENT_URL=https://localhost:8080/legal/user-agreement
      - CONFIDENTIAL_URL=https://localhost:8080/legal/confidential
      - SUPPORT_EMAIL=platform@intabia.ru
      - PERSONAL_DATA_URL=https://localhost:8080/legal/agreement
      - RULES_URL=https://localhost:8080/legal/rules
    # Debug: uncomment to enable remote debugging
    # ports:
    #   - 9234:9234
    # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9234
    restart: unless-stopped
  transactor:
    image: "intabiafusion/transactor:${DOCKER_TAG:-latest}"
    links:
      - postgres
      - minio
      - account
      - stats
    depends_on:
      redpanda:
        condition: service_started
    # Debug: uncomment to enable remote debugging
    # ports:
    #   - 9229:9229
    # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9229
    volumes:
      - ./branding.json:/var/cfg/branding.json
    environment:
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - SERVER_PORT=3332
      - REGION=
      - SERVER_SECRET=secret
      - ENABLE_COMPRESSION=true
      - FULLTEXT_URL=http://fulltext:4702
      - STATS_URL=http://stats:4900
      - DB_URL=${DB_URL_PG}
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - FRONT_URL=http://localhost:8087
      #      - MAIL_URL=http://mail_server:8097
      #      - MAIL_AUTH_TOKEN=naephea1Rai7eeth1noh
      - ACCOUNTS_URL=http://account:3000
      - LAST_NAME_FIRST=true
      - BRANDING_PATH=/var/cfg/branding.json
      - AI_BOT_URL=http://aibot:4010
      - RATE_LIMIT_MAX=25000 # 250 requests per 30 seconds
      - RATE_LIMIT_WINDOW=3000
      - FILES_URL=http://localhost:8087/_datalake/blob/:workspace/:blobId/:filename
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - HYLYLAKE_URL=http://love:8096
      - AI_BOT_URL=http://aibot:4010
      - WEB_PUSH_URL=http://notification:3335
    restart: unless-stopped
  rekoni:
    image: "intabiafusion/rekoni-service:${DOCKER_TAG:-latest}"
    restart: unless-stopped
    environment:
      - STATS_URL=http://stats:4901
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      # Debug: uncomment to enable remote debugging
      # ports:
      #   - 9239:9239
      # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9239
  fulltext:
    image: "intabiafusion/fulltext:${DOCKER_TAG:-latest}"
    depends_on:
      elastic:
        condition: service_healthy
    restart: unless-stopped
    links:
      - elastic
      - postgres
      - rekoni
    environment:
      - PORT=4702
      - REGION=
      - SERVER_SECRET=secret
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - DB_URL=${DB_URL_PG}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=local_storage_index # Same index for simplicity
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4900
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      # - HULYLAKE_URL=http://love:8096
      # Debug: uncomment to enable remote debugging
      # ports:
      #   - 9232:9232
      # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9232
  print:
    image: "intabiafusion/print:${DOCKER_TAG:-latest}"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    environment:
      - SECRET=secret
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - STATS_URL=http://stats:4900
      - ACCOUNTS_URL=http://account:3000
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  sign:
    image: "intabiafusion/sign:${DOCKER_TAG:-latest}"
    restart: unless-stopped
    volumes:
      - ../services/sign/pod-sign/debug/certificate.p12:/var/cfg/certificate.p12
      - ../services/sign/pod-sign/debug/branding.json:/var/cfg/branding.json
    environment:
      - SECRET=secret
      - MINIO_ENDPOINT=minio
      - REGION=
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - ACCOUNTS_URL=http://account:3000
      - CERTIFICATE_PATH=/var/cfg/certificate.p12
      - SERVICE_ID=sign-service
      - BRANDING_PATH=/var/cfg/branding.json
      - STATS_URL=http://stats:4900
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  love:
    image: "intabiafusion/love:${DOCKER_TAG:-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8096
      - SECRET=secret
      - ACCOUNTS_URL=http://account:3000
      - DB_URL=${DB_URL_PG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - S3_STORAGE_CONFIG=s3|http://minio:9000?accessKey=minioadmin&secretKey=minioadmin&rootBucket=love-recordings
      - LIVEKIT_HOST=ws://host.docker.internal:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_WEBHOOK_API_KEY=whkey
      - LIVEKIT_WEBHOOK_API_SECRET=whsecret
      - LIVEKIT_PROJECT=dev-project
      - BILLING_URL=http://billing:4041
      - BILLING_POLL_INTERVAL=15
      - AGENTS=transcribe-dev
      - WEBHOOK_URL=http://localhost:8087/_love/webhook
      - POLLING_ENABLED=true
      - POLLING_INTERVAL_MS=30000
      - PENDING_JOIN_TIMEOUT_MS=60000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - QUEUE_REGION=
    # Debug: uncomment to enable remote debugging
    # ports:
    #   - 9237:9237
    # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9237
    restart: unless-stopped

  aibot:
    image: "intabiafusion/ai-bot:${DOCKER_TAG:-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      # Model registry (levels -> models). See pod-ai-bot/config.example.yaml.
      - ./config-aibot.yaml:/var/cfg/config.yaml
    environment:
      # Account and Server Configuration
      - ACCOUNTS_URL=http://account:3000
      - SERVER_SECRET=secret
      - SERVICE_ID=ai-bot-service
      - API_TOKEN=api-secret
      # Multi-level model registry (overrides the single-provider env synthesis below).
      - CONFIG_PATH=/var/cfg/config.yaml
      # All-in-one role: event-router + llm-router + stt-worker (+ stt-ingest).
      # Split into MODE=event-router / llm-router / stt-worker for prod topology.
      - MODE=all
      # Full LLM payload logging (messages, tool defs, function calls, completions).
      - LLM_DEBUG=true

      # Bot Identity Configuration
      - FIRST_NAME=Julia
      - LAST_NAME=AI
      - PASSWORD=password
      - AVATAR_PATH=./avatar.png
      - AVATAR_CONTENT_TYPE=.png

      # Port Configuration
      - PORT=4010

      # LLM Configuration
      # - LLM_PROVIDER=openai
      # - OPENAI_API_KEY=token
      # - OPENAI_MODEL=gpt-4o-mini
      # - OPENAI_BASE_URL=http://host.docker.internal:1234/v1/
      # - OPENAI_SUMMARY_MODEL=openai/gpt-oss-20b
      # - OPENAI_TRANSLATE_MODEL=openai/gpt-oss-20b

      # GigaChat Configuration (only if using GigaChat)
      - LLM_PROVIDER=server # gigachat
      # Auth key for the gigachat provider in config-aibot.yaml (${GIGACHAT_AUTH_KEY}
      # placeholder is expanded from this env by the pod).
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY}
      - GIGACHAT_CLIENT_ID=${GIGACHAT_CLIENT_ID}
      # - GIGACHAT_SCOPE=GIGACHAT_API_PERS
      # - GIGACHAT_MODEL=GigaChat-2
      # - GIGACHAT_BASE_URL=https://gigachat.devices.sberbank.ru/api/v1/
      # - GIGACHAT_TIMEOUT=600

      # ASR: provider/model come from the yaml `asr:` block. STT_PROVIDER is an opt-out
      # switch only ('none' disables). Unset here = ASR enabled via the registry.

      # Deepgram Configuration (only if using Deepgram)
      # - DEEPGRAM_API_KEY=your-deepgram-api-key
      # - DEEPGRAM_PROJECT_ID=your-project-id
      # - DEEPGRAM_TAG=tag
      # - DEEPGRAM_POLL_INTERVAL_MINUTES=60

      # VAD Configuration
      - VAD_RMS_THRESHOLD=0.02
      - VAD_SPEECH_RATIO_THRESHOLD=0.1

      # Service Integration Configuration
      - LOVE_ENDPOINT=http://love:8096
      - BILLING_URL=http://billing:4041
      - DATALAB_API_KEY=
      # Dev only: append in/out/reasoning tokens + tok/s to every reply.
      - LLM_SHOW_USAGE=false

      # Content and History Limits
      - MAX_CONTENT_TOKENS=100000
      - MAX_HISTORY_RECORDS=500

      # Additional environment variables
      - QUEUE_CONFIG=${QUEUE_CONFIG}
      - STORAGE_CONFIG=${STORAGE_CONFIG}
      - CHUNK_STORAGE_CONFIG=${CHUNK_STORAGE_CONFIG}
      - STATS_URL=http://stats:4900
    # Debug: uncomment to enable remote debugging
    # ports:
    #   - 9236:9236
    # Add to environment: NODE_OPTIONS=--inspect=0.0.0.0:9236
  aibot_client_llm:
    image: "intabiafusion/ai-bot:${DOCKER_TAG:-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      # Client model registry: level -> model on the local OpenAI-compatible endpoint.
      # low -> gpt-oss-20b, middle -> GigaChat3.1-10B (both via host :8000/v1).
      - ./config-aibot-client.yaml:/var/cfg/config.yaml
    environment:
      - API_TOKEN=api-secret
      - MODE=client
      # Logical worker id, echoed in results so the router attributes per-client usage.
      - CLIENT_ID=client-llm-local
      - SERVER_URL=ws://aibot:4010
      # Model registry (endpoint/models/levels live here, not in env).
      - CONFIG_PATH=/var/cfg/config.yaml
      # Local endpoint override: forwarded from the host shell into the container so the
      # config-aibot-client.yaml ${CLISR_HOST}/${CLISR_MODEL} placeholders resolve.
      - CLISR_HOST=${CLISR_HOST:-}
      - CLISR_MODEL=${CLISR_MODEL:-}
      # Full LLM payload logging (messages, tool defs, tool calls, completions).
      - LLM_DEBUG=true

      # GigaChat Configuration (only if using GigaChat)
      # - LLM_PROVIDER=gigachat
      # - GIGACHAT_CREDENTIALS=${GIGACHAT_AUTH_KEY}
      # - GIGACHAT_SCOPE=GIGACHAT_API_PERS
      # - GIGACHAT_MODEL=GigaChat-2
      # - GIGACHAT_BASE_URL=https://gigachat.devices.sberbank.ru/api/v1/
      # - GIGACHAT_TIMEOUT=600

      # Content and History Limits
      - MAX_CONTENT_TOKENS=100000
      - MAX_HISTORY_RECORDS=500

      - STATS_URL=http://stats:4900

      # LLM-only worker: opt out of ASR even though the shared registry yaml has an `asr:` block.
      - STT_PROVIDER=none
  aibot_client_stt:
    image: "intabiafusion/ai-bot:${DOCKER_TAG:-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      # Same client registry as aibot_client_llm; the `asr:` block drives transcription.
      - ./config-aibot-client.yaml:/var/cfg/config.yaml
    environment:
      - API_TOKEN=api-secret
      - MODE=client
      # Logical worker id, echoed in results so the router attributes per-client usage.
      - CLIENT_ID=client-stt-local
      - SERVER_URL=ws://aibot:4010
      # ASR registry (endpoint/models/levels live in the yaml `asr:` block, not in env).
      - CONFIG_PATH=/var/cfg/config.yaml

      # LLM opt-out: this worker only serves ASR (from the yaml `asr:` block).
      - LLM_PROVIDER=none

      # VAD Configuration
      - VAD_RMS_THRESHOLD=0.02
      - VAD_SPEECH_RATIO_THRESHOLD=0.1

      - DATALAB_API_KEY=

      # Content and History Limits
      - MAX_CONTENT_TOKENS=100000
      - MAX_HISTORY_RECORDS=500

      - STATS_URL=http://stats:4900
