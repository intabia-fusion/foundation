upstream front_servers {
    server front0:8083;
    keepalive 32;
}

# Keepalive pool to every backend. Without `keepalive` here nginx opens a new TCP
# connection per request - measured at ~6x fewer requests per CPU second.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

upstream account_up { server account:3003; keepalive 32; }
upstream billing_up { server billing:4043; keepalive 32; }
upstream collaborator0_up { server collaborator0:3079; keepalive 32; }
upstream datalake_up { server datalake:4031; keepalive 32; }
upstream fulltext_up { server fulltext:4710; keepalive 32; }
upstream print_up { server 127.0.0.1:4005; keepalive 32; }
upstream love_up { server love:8087; keepalive 32; }
upstream payment_up { server payment:4044; keepalive 32; }
upstream preview_up { server preview:4040; keepalive 32; }
upstream rekoni_up { server rekoni:4004; keepalive 32; }
upstream sign_up { server sign:4006; keepalive 32; }
upstream stats_up { server stats:4901; keepalive 32; }
upstream stream_up { server stream:1080; keepalive 32; }
upstream tbank_subscriptions_up { server tbank-subscriptions:4042; keepalive 32; }
upstream transactor0_up { server transactor0:3334; keepalive 32; }

server {
    listen 8083;
    server_name localhost;

    client_max_body_size 0;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://front_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for file streaming
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /_account {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/_account(/.*)$ $1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://account_up/;
    }

    location /_tr0 {
